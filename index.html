<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Off-Campus & Popüler Kültür Pazarı</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-gold: #facc15;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.2rem 2rem; background: var(--card-bg); border-radius: 12px;
      margin-bottom: 20px; border: 1px solid var(--border);
    }

    .coin-display {
      font-size: 1.3rem; font-weight: 800; color: var(--accent-gold);
      display: flex; align-items: center; gap: 8px;
      background: rgba(250, 204, 21, 0.1); padding: 8px 16px; border-radius: 20px;
      transition: transform 0.15s;
    }
    .coin-display.bump { transform: scale(1.12); }

    .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }

    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

    .section-title { font-size: 1.3rem; margin-bottom: 15px; color: var(--accent); display: flex; align-items: center; gap: 8px; }

    /* --- Kazanç Kutusu (Quiz + Oyun) --- */
    .earn-box {
      background: var(--card-bg); padding: 25px; border-radius: 12px;
      margin-bottom: 25px; border: 1px solid var(--border);
    }

    .mode-tabs { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
    .mode-tab {
      background: transparent; border: none; color: var(--text-muted);
      padding: 10px 6px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s;
    }
    .mode-tab:hover { color: var(--text); }
    .mode-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .quiz-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
    .quiz-question { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }

    .options-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

    .option-btn {
      background: var(--card-inner); color: var(--text); border: 1px solid var(--border);
      padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; cursor: pointer;
      text-align: left; transition: all 0.2s;
    }

    .option-btn:hover:not(:disabled) { background: #334155; border-color: var(--accent); }
    .option-btn.correct { background: var(--success); color: #000; font-weight: bold; }
    .option-btn.wrong { background: var(--danger); color: #fff; font-weight: bold; }

    .quiz-feedback { min-height: 24px; font-size: 0.95rem; font-weight: bold; margin-bottom: 12px; }

    .next-btn, .newgame-btn {
      background: var(--accent); color: #0f172a; border: none; font-weight: bold;
      padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none;
    }

    /* --- Hafıza Oyunu --- */
    .game-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 0.9rem; color: var(--text-muted); }
    .game-meta strong { color: var(--text); }

    .memory-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px;
    }
    @media (max-width: 480px) { .memory-grid { grid-template-columns: repeat(3, 1fr); } }

    .memory-card {
      aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card-inner); display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; cursor: pointer; user-select: none;
      transition: transform 0.25s, background 0.2s, border-color 0.2s;
    }
    .memory-card:hover:not(.flipped):not(.matched) { border-color: var(--accent); }
    .memory-card.flipped, .memory-card.matched { background: #263349; }
    .memory-card.matched { border-color: var(--success); opacity: 0.75; cursor: default; }
    .memory-card .face-down { color: var(--text-muted); font-size: 1.3rem; }

    .game-result {
      background: rgba(34, 197, 94, 0.12); border: 1px solid var(--success);
      color: var(--success); padding: 12px 16px; border-radius: 8px; font-weight: bold;
      margin-bottom: 14px; display: none;
    }

    /* --- Market Kartları --- */
    .market-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }

    .character-card {
      background: var(--card-bg); border-radius: 12px; overflow: hidden;
      border: 1px solid var(--border); display: flex; flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }

    .character-card:hover { transform: translateY(-4px); border-color: var(--accent); }

    .card-img-wrap {
      width: 100%; height: 260px; background-color: #0b1120;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }

    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-placeholder { font-size: 3.5rem; }

    .card-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .char-source { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; font-weight: bold; margin-bottom: 4px; }
    .char-name { font-size: 1.15rem; font-weight: bold; margin-bottom: 2px; }
    .char-role { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    .char-price { font-size: 1.1rem; color: var(--accent-gold); font-weight: bold; margin-bottom: 12px; text-align: center; }

    .btn { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    .btn-buy { background: #334155; color: var(--text); }
    .btn-buy:hover:not(:disabled) { background: var(--accent); color: #0f172a; }
    .btn-buy:disabled { opacity: 0.5; cursor: not-allowed; }

    /* --- Sidebar Panelleri --- */
    .sidebar { display: flex; flex-direction: column; gap: 20px; }
    .panel { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .cart-list, .inventory-list { list-style: none; margin-bottom: 15px; max-height: 220px; overflow-y: auto; }
    .cart-item, .inventory-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .btn-checkout { background: var(--success); color: #0f172a; font-size: 1rem; }
    .btn-remove { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.1rem; }

    /* --- Toast bildirimleri --- */
    #toast-stack {
      position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column;
      gap: 10px; z-index: 999;
    }
    .toast {
      background: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--accent);
      color: var(--text); padding: 12px 16px; border-radius: 8px; font-size: 0.9rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      animation: toast-in 0.2s ease-out, toast-out 0.3s ease-in 2.7s forwards;
      max-width: 280px;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    @keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toast-out { to { opacity: 0; transform: translateX(20px); } }
  </style>
</head>
<body>

  <div id="toast-stack"></div>

  <header>
    <h1>🏒 Karakter Koleksiyonu</h1>
    <div class="coin-display" id="coin-display">🪙 <span id="coin-counter">0</span> Coin</div>
  </header>

  <div class="container">
    <main>
      <!-- Coin Kazanma Alanı: Quiz + Mini Oyun -->
      <div class="earn-box">
        <div class="mode-tabs">
          <button class="mode-tab active" id="tab-quiz">🧠 Bilgi Yarışması</button>
          <button class="mode-tab" id="tab-game">🎴 Hafıza Oyunu</button>
        </div>

        <!-- Quiz Paneli -->
        <div id="quiz-panel">
          <div class="quiz-header">
            <span id="quiz-category">Off-Campus Quiz</span>
            <span>Ödül: +25 Coin</span>
          </div>
          <div class="quiz-question" id="quiz-question">Soru yükleniyor...</div>
          <div class="options-grid" id="options-container"></div>
          <div class="quiz-feedback" id="quiz-feedback"></div>
          <button class="next-btn" id="next-btn">Sonraki Soruya Geç ➔</button>
        </div>

        <!-- Hafıza Oyunu Paneli -->
        <div id="game-panel" style="display:none;">
          <div class="quiz-header">
            <span>Kartları Eşleştir</span>
            <span>Az hamlede bitir, çok coin kazan</span>
          </div>
          <div class="game-meta">
            <span>Hamle: <strong id="move-counter">0</strong></span>
            <span>Eşleşen: <strong id="match-counter">0</strong>/6</span>
          </div>
          <div class="game-result" id="game-result"></div>
          <div class="memory-grid" id="memory-grid"></div>
          <button class="newgame-btn" id="newgame-btn" style="display:inline-block;">🔄 Yeni Oyun</button>
        </div>
      </div>

      <!-- Karakter Pazarı -->
      <h2 class="section-title">👥 Transfer Listesi & Karakterler</h2>
      <div class="market-grid" id="market-container"></div>
    </main>

    <aside class="sidebar">
      <!-- Sepet -->
      <div class="panel">
        <h2 class="section-title">🛒 Sepet</h2>
        <ul class="cart-list" id="cart-list">
          <li style="color: var(--text-muted); font-size: 0.85rem;">Sepetiniz boş.</li>
        </ul>
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: bold;">
          <span>Toplam:</span>
          <span id="cart-total" style="color: var(--accent-gold);">0 Coin</span>
        </div>
        <button class="btn btn-checkout" id="checkout-btn">Satın Al</button>
      </div>

      <!-- Koleksiyon -->
      <div class="panel">
        <h2 class="section-title">🖼️ Koleksiyonun</h2>
        <ul class="inventory-list" id="inventory-list">
          <li style="color: var(--text-muted); font-size: 0.85rem;">Henüz bir karakter almadın.</li>
        </ul>
      </div>
    </aside>
  </div>

  <script>
    // --- OYUN & MARKET VERİSİ ---
    let coins = 0;
    let cart = [];
    let inventory = [];

    // Quiz Soruları (Off Campus & Popüler Kültür)
    const questions = [
      {
        category: "Off Campus / The Deal",
        question: "Garrett Graham, Briar Üniversitesi'nde hangi spor takımının kaptanıdır?",
        options: ["Futbol", "Buz Hokeyi", "Basketbol", "Beyzbol"],
        correct: 1
      },
      {
        category: "Off Campus / The Deal",
        question: "Garrett, hangi dersi geçmek ve takımda kalmak için Hannah Wells'ten özel ders ister?",
        options: ["Felsefe", "Tarih", "Mikroiktisat", "Biyoloji"],
        correct: 0
      },
      {
        category: "Off Campus / The Deal",
        question: "Hannah'nın üniversitedeki ana eğitim/bölüm alanı nedir?",
        options: ["Hukuk", "Müzik / Klasik Kompozisyon", "Edebiyat", "Spor Yönetimi"],
        correct: 1
      },
      {
        category: "Off Campus / The Score",
        question: "Dean Di Laurentis ile Allie Hayes arasındaki hikayeyi anlatan serinin 3. kitabı hangisidir?",
        options: ["The Mistake", "The Goal", "The Score", "The Legacy"],
        correct: 2
      },
      {
        category: "Dizi & Popüler Kültür",
        question: "Harry Potter serisinde Gryffindor binasının simgesi hangi hayvandır?",
        options: ["Porsuk", "Yılan", "Kartal", "Aslan"],
        correct: 3
      },
      {
        category: "Dizi & Popüler Kültür",
        question: "The Witcher serisinde Geralt of Rivia'nın lakaplarından biri nedir?",
        options: ["Blaviken Kasabı", "Kış Muhafızı", "Gölge Lordu", "Ejderha Katili"],
        correct: 0
      }
    ];

    let currentQuestionIndex = 0;

    // Karakterler (Görsel URL'lerini istediğin gibi doldurabilirsin)
    const characters = [
      { id: 1, source: "Off Campus", name: "Garrett Graham", role: "Briar Hokey Kaptanı (#1)", price: 50, emoji: "🏒", image: "garrettgraham.jpg" },
      { id: 2, source: "Off Campus", name: "John Logan", role: "Hokey Oyuncusu", price: 50, emoji: "🏒", image: "johnlogan.jpg" },
      { id: 3, source: "Off Campus", name: "Dean Di Laurentis", role: "Hokey Oyuncusu", price: 50, emoji: "🏒", image: "deanlaurentis.jpg" },
      { id: 4, source: "Off Campus", name: "John Tucker", role: "Hokey Oyuncusu", price: 50, emoji: "🏒", image: "tuckeroffcampus.jpg" }
    ];

    // --- DOM ELEMENTLERİ ---
    const coinDisplay = document.getElementById('coin-display');
    const coinCounter = document.getElementById('coin-counter');
    const quizCategory = document.getElementById('quiz-category');
    const quizQuestion = document.getElementById('quiz-question');
    const optionsContainer = document.getElementById('options-container');
    const quizFeedback = document.getElementById('quiz-feedback');
    const nextBtn = document.getElementById('next-btn');

    const marketContainer = document.getElementById('market-container');
    const cartList = document.getElementById('cart-list');
    const cartTotal = document.getElementById('cart-total');
    const checkoutBtn = document.getElementById('checkout-btn');
    const inventoryList = document.getElementById('inventory-list');

    const tabQuiz = document.getElementById('tab-quiz');
    const tabGame = document.getElementById('tab-game');
    const quizPanel = document.getElementById('quiz-panel');
    const gamePanel = document.getElementById('game-panel');

    // --- TOAST BİLDİRİMLERİ (alert() yerine) ---
    function showToast(message, type = 'info') {
      const stack = document.getElementById('toast-stack');
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerText = message;
      stack.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function addCoins(amount) {
      coins += amount;
      coinDisplay.classList.add('bump');
      setTimeout(() => coinDisplay.classList.remove('bump'), 150);
      updateUI();
    }

    // --- SEKME GEÇİŞİ (Quiz <-> Hafıza Oyunu) ---
    tabQuiz.addEventListener('click', () => {
      tabQuiz.classList.add('active');
      tabGame.classList.remove('active');
      quizPanel.style.display = 'block';
      gamePanel.style.display = 'none';
    });

    tabGame.addEventListener('click', () => {
      tabGame.classList.add('active');
      tabQuiz.classList.remove('active');
      gamePanel.style.display = 'block';
      quizPanel.style.display = 'none';
    });

    // --- QUIZ MANTIĞI ---
    function loadQuestion() {
      const q = questions[currentQuestionIndex];
      quizCategory.innerText = q.category;
      quizQuestion.innerText = q.question;
      quizFeedback.innerText = '';
      nextBtn.style.display = 'none';
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function selectAnswer(selectedIdx) {
      const q = questions[currentQuestionIndex];
      const buttons = optionsContainer.querySelectorAll('.option-btn');

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIdx === q.correct) {
        buttons[selectedIdx].classList.add('correct');
        addCoins(25);
        quizFeedback.style.color = 'var(--success)';
        quizFeedback.innerText = '🎉 Harika! Doğru cevap (+25 Coin)';
      } else {
        buttons[selectedIdx].classList.add('wrong');
        buttons[q.correct].classList.add('correct');
        quizFeedback.style.color = 'var(--danger)';
        quizFeedback.innerText = '❌ Yanlış cevap! Doğru olan işaretlendi.';
      }

      nextBtn.style.display = 'inline-block';
    }

    nextBtn.addEventListener('click', () => {
      currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
      loadQuestion();
    });

    // --- HAFIZA OYUNU MANTIĞI ---
    const memoryEmojis = ['🏒', '📚', '⚡', '🐺', '🎭', '🔥'];
    const memoryGrid = document.getElementById('memory-grid');
    const moveCounterEl = document.getElementById('move-counter');
    const matchCounterEl = document.getElementById('match-counter');
    const gameResultEl = document.getElementById('game-result');
    const newGameBtn = document.getElementById('newgame-btn');

    let memoryDeck = [];
    let flippedCards = [];
    let matchedCount = 0;
    let moveCount = 0;
    let boardLocked = false;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startMemoryGame() {
      const pairSet = shuffle([...memoryEmojis, ...memoryEmojis]);
      memoryDeck = pairSet.map((emoji, idx) => ({ id: idx, emoji, flipped: false, matched: false }));
      flippedCards = [];
      matchedCount = 0;
      moveCount = 0;
      boardLocked = false;

      moveCounterEl.innerText = moveCount;
      matchCounterEl.innerText = matchedCount;
      gameResultEl.style.display = 'none';

      renderMemoryGrid();
    }

    function renderMemoryGrid() {
      memoryGrid.innerHTML = '';
      memoryDeck.forEach(card => {
        const el = document.createElement('div');
        el.className = 'memory-card' + (card.flipped ? ' flipped' : '') + (card.matched ? ' matched' : '');
        el.innerHTML = (card.flipped || card.matched)
          ? card.emoji
          : '<span class="face-down">?</span>';
        el.onclick = () => flipCard(card.id);
        memoryGrid.appendChild(el);
      });
    }

    function flipCard(id) {
      if (boardLocked) return;
      const card = memoryDeck.find(c => c.id === id);
      if (!card || card.flipped || card.matched) return;

      card.flipped = true;
      flippedCards.push(card);
      renderMemoryGrid();

      if (flippedCards.length === 2) {
        moveCount++;
        moveCounterEl.innerText = moveCount;
        boardLocked = true;

        const [a, b] = flippedCards;
        if (a.emoji === b.emoji) {
          a.matched = true;
          b.matched = true;
          matchedCount++;
          matchCounterEl.innerText = matchedCount;
          flippedCards = [];
          boardLocked = false;
          renderMemoryGrid();

          if (matchedCount === memoryEmojis.length) {
            finishMemoryGame();
          }
        } else {
          setTimeout(() => {
            a.flipped = false;
            b.flipped = false;
            flippedCards = [];
            boardLocked = false;
            renderMemoryGrid();
          }, 700);
        }
      }
    }

    function finishMemoryGame() {
      // Az hamleyle bitirince daha çok coin: 6 hamlede tavan ödül, her fazla hamlede azalır.
      const perfectMoves = memoryEmojis.length; // 6
      const reward = Math.max(15, 80 - (moveCount - perfectMoves) * 4);
      gameResultEl.style.display = 'block';
      gameResultEl.innerText = `🏆 Tebrikler! ${moveCount} hamlede bitirdin. +${reward} Coin kazandın!`;
      addCoins(reward);
      showToast(`Hafıza oyunu tamamlandı: +${reward} Coin`, 'success');
    }

    newGameBtn.addEventListener('click', startMemoryGame);

    // --- MARKET MANTIĞI ---
    function renderMarket() {
      marketContainer.innerHTML = '';
      characters.forEach(char => {
        const isOwned = inventory.some(item => item.id === char.id);
        const card = document.createElement('div');
        card.className = 'character-card';

        const imageHtml = char.image
          ? `<img src="${char.image}" alt="${char.name}" class="card-img" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-placeholder',innerText:'${char.emoji}'}))">`
          : `<div class="card-placeholder">${char.emoji}</div>`;

        card.innerHTML = `
          <div class="card-img-wrap">${imageHtml}</div>
          <div class="card-info">
            <div>
              <div class="char-source">${char.source}</div>
              <div class="char-name">${char.name}</div>
              <div class="char-role">${char.role}</div>
            </div>
            <div>
              <div class="char-price">🪙 ${char.price} Coin</div>
              <button class="btn btn-buy" onclick="addToCart(${char.id})" ${isOwned ? 'disabled' : ''}>
                ${isOwned ? 'Koleksiyonda' : 'Sepete Ekle'}
              </button>
            </div>
          </div>
        `;
        marketContainer.appendChild(card);
      });
    }

    // --- SEPET ---
    window.addToCart = function(id) {
      const char = characters.find(c => c.id === id);
      if (!cart.some(item => item.id === id) && !inventory.some(item => item.id === id)) {
        cart.push(char);
        showToast(`${char.name} sepete eklendi.`);
        updateUI();
      }
    };

    window.removeFromCart = function(id) {
      cart = cart.filter(item => item.id !== id);
      updateUI();
    };

    checkoutBtn.addEventListener('click', () => {
      const total = cart.reduce((sum, item) => sum + item.price, 0);

      if (cart.length === 0) {
        showToast('Sepetiniz boş!', 'error');
        return;
      }

      if (coins >= total) {
        coins -= total;
        inventory.push(...cart);
        cart = [];
        showToast('Karakterler koleksiyonuna katıldı! 🎉', 'success');
        updateUI();
      } else {
        showToast(`Yetersiz Coin! ${total} Coin gerekiyor.`, 'error');
      }
    });

    // --- UI GÜNCELLEME ---
    function updateUI() {
      coinCounter.innerText = coins;

      cartList.innerHTML = cart.length === 0 ? '<li style="color: var(--text-muted); font-size: 0.85rem;">Sepetiniz boş.</li>' : '';
      let total = 0;
      cart.forEach(item => {
        total += item.price;
        const li = document.createElement('li');
        li.className = 'cart-item';
        li.innerHTML = `
          <span>${item.name}</span>
          <div>
            <span style="color: var(--accent-gold);">🪙 ${item.price}</span>
            <button class="btn-remove" onclick="removeFromCart(${item.id})">✖</button>
          </div>
        `;
        cartList.appendChild(li);
      });
      cartTotal.innerText = `${total} Coin`;

      inventoryList.innerHTML = inventory.length === 0 ? '<li style="color: var(--text-muted); font-size: 0.85rem;">Henüz bir karakter almadın.</li>' : '';
      inventory.forEach(item => {
        const li = document.createElement('li');
        li.className = 'inventory-item';
        li.innerHTML = `<span>${item.emoji} ${item.name}</span> <span style="color: var(--text-muted); font-size: 0.8rem;">${item.source}</span>`;
        inventoryList.appendChild(li);
      });

      renderMarket();
    }

    // Başlangıç Yüklemesi
    loadQuestion();
    startMemoryGame();
    updateUI();
  </script>
</body>
</html>
